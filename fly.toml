app = "hearthledger-saas"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "4174"
  DB_PATH = "/data/hearthledger.db"
  REQUIRE_AUTH_FOR_SYNC = "true"
  ALLOW_TEST_BILLING = "false"

[http_service]
  internal_port = 4174
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "hearthledger_data"
  destination = "/data"
